<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <style>.gone { display: none }</style>
  <rect x="0" y="0" width="10" height="10"/>
  <rect display="none" x="20" y="0" width="10" height="10"/>
  <rect style="display:none" x="40" y="0" width="10" height="10"/>
  <rect class="gone" x="60" y="0" width="10" height="10"/>
  <rect visibility="hidden" x="80" y="0" width="10" height="10"/>
  <g inkscape:groupmode="layer" inkscape:label="Hidden layer" style="display:none">
    <rect x="0" y="20" width="10" height="10"/>
    <text x="0" y="40">hidden text</text>
  </g>
  <g style="visibility:hidden">
    <rect x="20" y="20" width="10" height="10"/>
    <!-- visibility is inherited, but a child may turn it back on -->
    <rect style="visibility:visible" x="40" y="20" width="10" height="10"/>
    <image x="60" y="20" width="10" height="10" xlink:href="picture.png"/>
  </g>
</svg>
